name: Intégration continue

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verification:
    name: Types, lint, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Les tests d'intégration et d'isolation RLS créent leurs propres bases.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôle des secrets
        run: node scripts/verifier-secrets.mjs

      - name: Contrôle du vocabulaire
        run: node scripts/verifier-vocabulaire.mjs

      - name: Contrôle des exclusions
        run: node scripts/verifier-exclusions.mjs

      - name: Vérification des types
        run: |
          npx tsc --build --force
          npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx vitest run

      - name: Migrations rejouables sur une base vierge
        run: |
          psql "$TEST_DATABASE_URL" -c "CREATE DATABASE normelya_migrations;"
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/normelya_migrations" \
            node scripts/migrate.mjs
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/normelya_migrations" \
            node scripts/migrate.mjs
        env:
          PGPASSWORD: postgres

  build:
    name: Compilation de l'application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @normelya/web

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: normelya
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/normelya
      SERVICE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/normelya
      AUTH_PROVIDER: local
      STORAGE_PROVIDER: local
      MAIL_PROVIDER: console
      HASH_SALT: sel-integration-continue
      AI_ENABLED: 'false'
      # Une suite de bout en bout enchaîne des dizaines d'inscriptions depuis la
      # même adresse. Ce facteur est sans effet en production.
      RATE_LIMIT_FACTOR: '200'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Migrations
        run: node scripts/migrate.mjs

      - name: Navigateur
        run: npx playwright install --with-deps chromium

      - name: Parcours complets
        run: npx playwright test e2e/parcours-authentification.spec.ts e2e/parcours-fds.spec.ts

      - name: Compilation de production
        run: npm run build --workspace @normelya/web

      - name: Politique de contenu sous la configuration de production
        run: |
          npm run start --workspace @normelya/web -- -p 3100 &
          npx wait-on http://localhost:3100/connexion
          E2E_BASE_URL=http://localhost:3100 npx playwright test e2e/politique-de-contenu.spec.ts
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
